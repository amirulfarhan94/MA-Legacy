name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Firebase Hosting serves the HandalServ landing page (landing/) at the root and customer
      # application links (/a/…) from a root-based build of the app, renamed app.html. Skipped
      # until the FIREBASE_SERVICE_ACCOUNT secret is added; if it fails, GitHub Pages still deploys.
      - run: |
          npx vite build --base=/ --outDir dist-hosting
          mv dist-hosting/index.html dist-hosting/app.html
          sed -i 's#href="\./#href="/#g' dist-hosting/app.html
          cp -r landing/. dist-hosting/
      - if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ma-legacy
          channelId: live
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
